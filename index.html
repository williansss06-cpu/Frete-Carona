<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Frete Carona</title>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#17202a;--muted:#687384;--brand:#16a36a;--brand2:#0d7e52;--line:#e6e9ef;--warn:#fff6dd;--danger:#c83b3b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:620px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 40px #0000000c}.top{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;font-size:21px}.logo b{color:var(--brand)}.page{padding:18px 18px 92px}.hero{background:linear-gradient(135deg,#0d7e52,#19b877);color:#fff;padding:22px;border-radius:22px;margin-bottom:18px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;opacity:.92}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:18px;text-align:left;cursor:pointer;min-height:142px}.action .ico{font-size:31px}.action h3{margin:12px 0 5px}.action p,.muted{color:var(--muted);font-size:13px;margin:0}.section{margin-top:22px}.section h2{font-size:17px;margin:0 0 12px}.card{border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:10px;background:#fff}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#eef8f3;color:var(--brand2)}.full{width:100%}.field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9dee7;border-radius:11px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:transparent;font-size:10px;color:#687384;padding:4px}.nav span{display:block;font-size:20px}.nav .active{color:var(--brand);font-weight:800}.hide{display:none!important}.auth{padding:36px 22px}.auth .mark{font-size:40px}.auth h1{margin:8px 0}.tabs{display:flex;background:#f0f3f6;border-radius:12px;padding:4px;margin:20px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px}.tabs .on{background:#fff;font-weight:800;box-shadow:0 2px 8px #0001}.status{padding:10px 12px;border-radius:10px;font-size:13px;margin:10px 0;background:#eef8f3}.error{background:#fff0f0;color:var(--danger)}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef8f3;color:var(--brand2);font-size:11px;font-weight:800}.money{font-size:20px;font-weight:900;color:var(--brand2)}.empty{text-align:center;color:var(--muted);padding:25px 10px}.back{border:0;background:none;font-size:23px;cursor:pointer}.titlebar{display:flex;align-items:center;gap:8px;margin-bottom:18px}.titlebar h2{margin:0}.small{font-size:12px}.logout{border:0;background:#f3f5f8;padding:8px 10px;border-radius:9px;cursor:pointer}
</style></head><body><div class='app'>
<div id='auth' class='auth'><div class='mark'>🚗📦</div><h1>Frete <span style='color:var(--brand)'>Carona</span></h1><p class='muted'>Tem espaço? Tem oportunidade.</p><div class='tabs'><button id='tabLogin' class='on' onclick="authTab('login')">Entrar</button><button id='tabCadastro' onclick="authTab('cadastro')">Criar conta</button></div>
<div id='loginBox'><div class='field'><label>E-mail</label><input id='loginEmail' type='email' placeholder='seu@email.com'></div><div class='field'><label>Senha</label><input id='loginSenha' type='password' placeholder='••••••••'></div><button class='btn primary full' onclick='login()'>Entrar</button></div>
<div id='cadBox' class='hide'><div class='field'><label>Nome completo</label><input id='cadNome'></div><div class='field'><label>E-mail</label><input id='cadEmail' type='email'></div><div class='field'><label>Senha</label><input id='cadSenha' type='password' minlength='6'></div><button class='btn primary full' onclick='cadastrar()'>Criar minha conta</button></div><div id='authMsg'></div></div>
<div id='main' class='hide'><header class='top'><div class='logo'>Frete <b>Carona</b></div><button class='logout' onclick='logout()'>Sair</button></header><main id='content' class='page'></main><nav class='nav'><button data-page='home' onclick="go('home')"><span>⌂</span>Início</button><button data-page='envios' onclick="go('envios')"><span>📦</span>Envios</button><button data-page='viagens' onclick="go('viagens')"><span>🚗</span>Viagens</button><button data-page='oportunidades' onclick="go('oportunidades')"><span>⚡</span>Ofertas</button><button data-page='perfil' onclick="go('perfil')"><span>👤</span>Perfil</button></nav></div></div>
<script>
const SUPABASE_URL='https://rlugagtmbuseydsuyskc.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_5S522tMYto-HQI1N9T6iSg_qoxN15S9';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let user=null,profile=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function msg(t,e=false){document.getElementById('authMsg').innerHTML=`<div class='status ${e?'error':''}'>${esc(t)}</div>`}
function authTab(t){document.getElementById('loginBox').classList.toggle('hide',t!=='login');document.getElementById('cadBox').classList.toggle('hide',t!=='cadastro');document.getElementById('tabLogin').classList.toggle('on',t==='login');document.getElementById('tabCadastro').classList.toggle('on',t==='cadastro')}
async function login(){let {error}=await db.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginSenha.value});if(error)return msg(error.message,true);await boot()}
async function cadastrar(){let {error}=await db.auth.signUp({email:cadEmail.value.trim(),password:cadSenha.value,options:{data:{nome_completo:cadNome.value.trim()}}});if(error)return msg(error.message,true);msg('Conta criada. Se a confirmação de e-mail estiver ativa, confirme seu e-mail e depois entre.')}
async function logout(){await db.auth.signOut();location.reload()}
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session){auth.classList.remove('hide');main.classList.add('hide');return}user=session.user;auth.classList.add('hide');main.classList.remove('hide');let {data}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=data;go('home')}
function active(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p))}function go(p){active(p);({home,envios,viagens,oportunidades,perfil}[p]||home)()}
function home(){content.innerHTML=`<div class='hero'><h1>Olá, ${esc((profile?.nome_completo||user.email).split(' ')[0])} 👋</h1><p>O que você quer fazer hoje?</p></div><div class='grid'><button class='action' onclick='formEnvio()'><div class='ico'>📦</div><h3>Quero enviar</h3><p>Publique uma encomenda e encontre alguém que já está indo para lá.</p></button><button class='action' onclick='formViagem()'><div class='ico'>🚗</div><h3>Vou viajar</h3><p>Cadastre seu caminho e encontre oportunidades para levar junto.</p></button></div><div class='section'><h2>Como funciona</h2><div class='card'>1. Cadastre sua viagem ou encomenda.<br>2. O Frete Carona procura compatibilidades.<br>3. As duas partes aceitam.<br>4. Coleta e entrega ficam registradas na plataforma.</div></div>`}
function formEnvio(){content.innerHTML=`<div class='titlebar'><button class='back' onclick="go('home')">‹</button><h2>Nova encomenda</h2></div><div class='field'><label>O que você está enviando?</label><input id='eDesc' placeholder='Ex.: peças automotivas'></div><div class='row'><div class='field'><label>Volumes</label><input id='eVol' type='number' value='1' min='1'></div><div class='field'><label>Peso total (kg)</label><input id='ePeso' type='number' step='.01'></div></div><div class='field'><label>Endereço de coleta</label><input id='eColeta' placeholder='Rua, número, cidade - UF'></div><div class='field'><label>Cidade coleta</label><input id='eCCidade'></div><div class='field'><label>UF coleta</label><input id='eCUf' maxlength='2'></div><div class='field'><label>Endereço de entrega</label><input id='eEntrega' placeholder='Rua, número, cidade - UF'></div><div class='field'><label>Cidade entrega</label><input id='eECidade'></div><div class='field'><label>UF entrega</label><input id='eEUf' maxlength='2'></div><div class='field'><label>Entregar até</label><input id='ePrazo' type='datetime-local'></div><div class='field'><label>Quanto deseja pagar?</label><input id='eValor' type='number' step='.01' placeholder='R$'></div><button class='btn primary full' onclick='salvarEnvio()'>Publicar encomenda</button><div id='formMsg'></div>`}
async function salvarEnvio(){const obj={owner_id:user.id,descricao:eDesc.value.trim(),quantidade_volumes:+eVol.value||1,peso_total_kg:ePeso.value?+ePeso.value:null,coleta_endereco:eColeta.value.trim(),coleta_cidade:eCCidade.value.trim(),coleta_uf:eCUf.value.toUpperCase(),entrega_endereco:eEntrega.value.trim(),entrega_cidade:eECidade.value.trim(),entrega_uf:eEUf.value.toUpperCase(),entregar_ate:ePrazo.value?new Date(ePrazo.value).toISOString():null,valor_ofertado:+eValor.value||0,status:'RASCUNHO'};if(!obj.descricao||!obj.coleta_endereco||!obj.entrega_endereco||obj.valor_ofertado<=0)return formMsg.innerHTML="<div class='status error'>Preencha descrição, coleta, entrega e valor.</div>";let {data,error}=await db.from('encomendas').insert(obj).select('id').single();if(error)return formMsg.innerHTML=`<div class='status error'>${esc(error.message)}</div>`;let r=await db.rpc('publicar_encomenda',{p_encomenda_id:data.id});formMsg.innerHTML=`<div class='status'>Encomenda publicada. Matches encontrados: ${r.data??0}.</div>`;setTimeout(()=>go('envios'),900)}
async function envios(){content.innerHTML='<h2>Meus envios</h2><div class="empty">Carregando…</div>';let {data,error}=await db.from('encomendas').select('*').eq('owner_id',user.id).order('created_at',{ascending:false});if(error)return content.innerHTML=`<h2>Meus envios</h2><div class='status error'>${esc(error.message)}</div>`;content.innerHTML='<h2>Meus envios</h2>'+(data?.length?data.map(x=>`<div class='card'><span class='pill'>${esc(x.status)}</span><h3>${esc(x.descricao)}</h3><div class='muted'>${esc(x.coleta_cidade||x.coleta_endereco)} → ${esc(x.entrega_cidade||x.entrega_endereco)}</div><p class='money'>${brl(x.valor_ofertado)}</p><div class='small'>${x.codigo?esc(x.codigo):''}</div></div>`).join(''):`<div class='empty'>Você ainda não publicou encomendas.<br><br><button class='btn primary' onclick='formEnvio()'>Criar envio</button></div>`)}
function formViagem(){content.innerHTML=`<div class='titlebar'><button class='back' onclick="go('home')">‹</button><h2>Cadastrar viagem</h2></div><div class='field'><label>De onde você vai sair?</label><input id='vOrigem'></div><div class='row'><div class='field'><label>Cidade</label><input id='vOCidade'></div><div class='field'><label>UF</label><input id='vOUf' maxlength='2'></div></div><div class='field'><label>Para onde você vai?</label><input id='vDestino'></div><div class='row'><div class='field'><label>Cidade</label><input id='vDCidade'></div><div class='field'><label>UF</label><input id='vDUf' maxlength='2'></div></div><div class='row'><div class='field'><label>Data</label><input id='vData' type='date'></div><div class='field'><label>Saída</label><input id='vHora' type='time'></div></div><div class='row'><div class='field'><label>Capacidade disponível (kg)</label><input id='vKg' type='number' step='.01'></div><div class='field'><label>Desvio máximo (km)</label><input id='vDesvio' type='number' value='10'></div></div><button class='btn primary full' onclick='salvarViagem()'>Cadastrar viagem</button><div id='formMsg'></div>`}
async function salvarViagem(){const obj={user_id:user.id,origem_endereco:vOrigem.value.trim(),origem_cidade:vOCidade.value.trim(),origem_uf:vOUf.value.toUpperCase(),destino_endereco:vDestino.value.trim(),destino_cidade:vDCidade.value.trim(),destino_uf:vDUf.value.toUpperCase(),data_viagem:vData.value,horario_saida:vHora.value||null,capacidade_disponivel_kg:vKg.value?+vKg.value:null,desvio_maximo_km:+vDesvio.value||10,status:'ATIVA'};if(!obj.origem_endereco||!obj.destino_endereco||!obj.data_viagem)return formMsg.innerHTML="<div class='status error'>Preencha origem, destino e data.</div>";let {error}=await db.from('viagens').insert(obj);if(error)return formMsg.innerHTML=`<div class='status error'>${esc(error.message)}</div>`;formMsg.innerHTML="<div class='status'>Viagem cadastrada com sucesso.</div>";setTimeout(()=>go('viagens'),800)}
async function viagens(){content.innerHTML='<h2>Minhas viagens</h2><div class="empty">Carregando…</div>';let {data,error}=await db.from('viagens').select('*').eq('user_id',user.id).order('data_viagem',{ascending:true});if(error)return content.innerHTML=`<h2>Minhas viagens</h2><div class='status error'>${esc(error.message)}</div>`;content.innerHTML='<h2>Minhas viagens</h2>'+(data?.length?data.map(x=>`<div class='card'><span class='pill'>${esc(x.status)}</span><h3>${esc(x.origem_cidade||x.origem_endereco)} → ${esc(x.destino_cidade||x.destino_endereco)}</h3><div class='muted'>📅 ${esc(x.data_viagem)} ${x.horario_saida?'• '+esc(x.horario_saida.slice(0,5)):''}</div><div class='small' style='margin-top:8px'>Desvio máximo: ${esc(x.desvio_maximo_km)} km ${x.capacidade_disponivel_kg?'• '+esc(x.capacidade_disponivel_kg)+' kg':''}</div></div>`).join(''):`<div class='empty'>Nenhuma viagem cadastrada.<br><br><button class='btn primary' onclick='formViagem()'>Cadastrar viagem</button></div>`)}
async function oportunidades(){content.innerHTML='<h2>Oportunidades</h2><div class="empty">Carregando…</div>';let {data,error}=await db.from('ofertas').select('*').eq('viajante_id',user.id).order('created_at',{ascending:false});if(error)return content.innerHTML=`<h2>Oportunidades</h2><div class='status error'>${esc(error.message)}</div>`;content.innerHTML='<h2>Oportunidades</h2>'+(data?.length?data.map(x=>`<div class='card'><span class='pill'>${esc(x.status)}</span><h3>Frete disponível</h3><div class='money'>Você recebe ${brl(x.valor_viajante)}</div><div class='muted'>Frete ${brl(x.valor_frete)} • Comissão ${esc(x.percentual_comissao)}%</div>${x.status==='PENDENTE'?`<button class='btn primary full' style='margin-top:12px' onclick="aceitarOferta('${x.id}')">Aceitar oportunidade</button>`:''}</div>`).join(''):`<div class='empty'>Nenhuma oferta no momento.<br>Quando uma encomenda combinar com sua viagem, ela aparecerá aqui.</div>`)}
async function aceitarOferta(id){let {error}=await db.rpc('viajante_aceitar_oferta',{p_oferta_id:id});if(error)alert(error.message);else oportunidades()}
async function perfil(){let {data}=await db.from('profiles').select('*').eq('id',user.id).single();profile=data||profile;content.innerHTML=`<h2>Meu perfil</h2><div class='card'><div style='font-size:42px'>👤</div><h3>${esc(profile?.nome_completo||'Usuário')}</h3><div class='muted'>${esc(user.email)}</div><p>⭐ ${esc(profile?.nota_media||0)} • ${esc(profile?.total_avaliacoes||0)} avaliações</p><span class='pill'>${esc(profile?.verificacao_identidade||'PENDENTE')}</span></div><div class='card'><b>Uma conta, dois lados.</b><p class='muted' style='margin-top:7px'>Você pode enviar encomendas e também cadastrar viagens para ganhar levando algo no caminho.</p></div>`}
db.auth.onAuthStateChange(()=>{});boot();
</script></body></html>
