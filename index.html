<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Frete Carona</title>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#17202a;--muted:#687384;--brand:#16a36a;--brand2:#0d7e52;--line:#e6e9ef;--warn:#fff6dd;--danger:#c83b3b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:620px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 40px #0000000c}.top{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;font-size:21px}.logo b{color:var(--brand)}.page{padding:18px 18px 92px}.hero{background:linear-gradient(135deg,#075f43,#19b877);color:#fff;padding:22px;border-radius:22px;margin-bottom:18px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;opacity:.92}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:18px;text-align:left;cursor:pointer;min-height:142px}.action .ico{font-size:31px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.kpi b{display:block;font-size:18px;color:var(--brand2)}.tag{font-size:11px;color:var(--muted)}.action h3{margin:12px 0 5px}.action p,.muted{color:var(--muted);font-size:13px;margin:0}.section{margin-top:22px}.section h2{font-size:17px;margin:0 0 12px}.card{border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:10px;background:#fff}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#eef8f3;color:var(--brand2)}.full{width:100%}.field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9dee7;border-radius:11px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:transparent;font-size:10px;color:#687384;padding:4px}.nav span{display:block;font-size:20px}.nav .active{color:var(--brand);font-weight:800}.hide{display:none!important}.auth{padding:36px 22px}.auth .mark{font-size:40px}.auth h1{margin:8px 0}.tabs{display:flex;background:#f0f3f6;border-radius:12px;padding:4px;margin:20px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px}.tabs .on{background:#fff;font-weight:800;box-shadow:0 2px 8px #0001}.status{padding:10px 12px;border-radius:10px;font-size:13px;margin:10px 0;background:#eef8f3}.error{background:#fff0f0;color:var(--danger)}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef8f3;color:var(--brand2);font-size:11px;font-weight:800}.money{font-size:20px;font-weight:900;color:var(--brand2)}.empty{text-align:center;color:var(--muted);padding:25px 10px}.back{border:0;background:none;font-size:23px;cursor:pointer}.titlebar{display:flex;align-items:center;gap:8px;margin-bottom:18px}.titlebar h2{margin:0}.map{height:230px;border:1px solid var(--line);border-radius:16px;margin:12px 0;background:#eef3f0}.mapnote{font-size:12px;color:var(--muted);margin:-4px 0 12px}.small{font-size:12px}.logout{border:0;background:#f3f5f8;padding:8px 10px;border-radius:9px;cursor:pointer}.ops{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.live{background:#eafaf2;border:1px solid #bfe9d2;border-radius:14px;padding:12px;margin:12px 0}.proof{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:8px}.dangerbtn{background:#fff0f0;color:#a72d2d}.routeinfo{font-size:13px;color:var(--muted);margin:8px 0}.step{display:flex;gap:10px;align-items:flex-start;margin:9px 0}.dot{width:12px;height:12px;border-radius:50%;background:var(--brand);margin-top:4px;flex:none}.verify{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.verify:last-child{border-bottom:0}.ok{color:#0d7e52;font-weight:800}.pending{color:#9a6b00;font-weight:800}.blocked{color:#b42318;font-weight:800}.notice{background:#fff8e7;border:1px solid #f0d88b;border-radius:14px;padding:12px;margin:12px 0}.shield{font-size:36px}.checkline{display:flex;gap:8px;align-items:flex-start;font-size:13px}.docbox,.recbox{border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;background:#fafcfb}.docchoice,.choice{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.docchoice button,.choice button{border:1px solid var(--line);background:#fff;padding:10px;border-radius:10px}.docchoice .on,.choice .on{background:#eef8f3;border-color:#9dd7bb;color:var(--brand2);font-weight:800}.days{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.day{border:1px solid var(--line);padding:7px 9px;border-radius:9px;background:#fff;font-size:12px}
.pac-container{z-index:999999!important}.pac-item{cursor:pointer!important}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.choice button{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:800;cursor:pointer}.choice button.on{background:#eafaf2;border-color:#78d5aa;color:var(--brand2)}.days{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0 14px}.day{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:10px;padding:9px 7px;font-size:12px}.checkline{display:flex;align-items:center;gap:9px;margin:8px 0 14px}.checkline input{width:auto}.recbox{background:#f7fbf9;border:1px solid #dcefe5;border-radius:14px;padding:13px;margin-bottom:14px}.docbox{background:#f8faf9;border:1px solid #dce7e1;border-radius:14px;padding:13px;margin:12px 0}.docchoice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0}.docchoice button{padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:800}.docchoice button.on{background:#eafaf2;border-color:#78d5aa;color:var(--brand2)}
</style></head><body><div class='app'>
<div id='auth' class='auth'><div class='mark'>🚗📦</div><h1>Frete <span style='color:var(--brand)'>Carona</span></h1><p class='muted'>Tem espaço? Tem oportunidade.</p><div class='tabs'><button id='tabLogin' class='on' onclick="authTab('login')">Entrar</button><button id='tabCadastro' onclick="authTab('cadastro')">Criar conta</button></div>
<div id='loginBox'><div class='field'><label>E-mail</label><input id='loginEmail' type='email' placeholder='seu@email.com'></div><div class='field'><label>Senha</label><input id='loginSenha' type='password' placeholder='••••••••'></div><button class='btn primary full' onclick='login()'>Entrar</button><button class='btn secondary full' style='margin-top:9px' onclick='reenviarConfirmacao()'>Reenviar e-mail de confirmação</button><div class='small muted' style='margin-top:8px'>Se você criou a conta e ainda não confirmou o e-mail, informe o e-mail acima e solicite um novo link.</div></div>
<div id='cadBox' class='hide'><div class='field'><label>Nome completo</label><input id='cadNome'></div><div class='field'><label>E-mail</label><input id='cadEmail' type='email'></div><div class='field'><label>Senha</label><input id='cadSenha' type='password' minlength='6'></div><button class='btn primary full' onclick='cadastrar()'>Criar minha conta</button></div><div id='authMsg'></div></div>
<div id='main' class='hide'><header class='top'><div class='logo'>Frete <b>Carona</b></div><button class='logout' onclick='logout()'>Sair</button></header><main id='content' class='page'></main><nav class='nav'><button data-page='home' onclick="go('home')"><span>⌂</span>Início</button><button data-page='envios' onclick="go('envios')"><span>📦</span>Envios</button><button data-page='viagens' onclick="go('viagens')"><span>🚗</span>Viagens</button><button data-page='oportunidades' onclick="go('oportunidades')"><span>⚡</span>Ofertas</button><button data-page='perfil' onclick="go('perfil')"><span>👤</span>Perfil</button></nav></div></div>
<script>
const CONFIG={
  SUPABASE_URL:'https://rlugagtmbuseydsuyskc.supabase.co',
  SUPABASE_PUBLISHABLE_KEY:'SUA_CHAVE_PUBLICAVEL',
  GOOGLE_MAPS_KEY:'AIzaSyAo-qusN6jZTGpo1w1BlFqsSrqmVHCLjuU',
  AUTH_REDIRECT_URL:'https://williansss06-cpu.github.io/Frete-Carona/'
};
const SUPABASE_URL=CONFIG.SUPABASE_URL;
const SUPABASE_PUBLISHABLE_KEY=CONFIG.SUPABASE_PUBLISHABLE_KEY;
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let user=null,profile=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function msg(t,e=false){document.getElementById('authMsg').innerHTML=`<div class='status ${e?'error':''}'>${esc(t)}</div>`}
function authTab(t){document.getElementById('loginBox').classList.toggle('hide',t!=='login');document.getElementById('cadBox').classList.toggle('hide',t!=='cadastro');document.getElementById('tabLogin').classList.toggle('on',t==='login');document.getElementById('tabCadastro').classList.toggle('on',t==='cadastro')}
async function login(){let {error}=await db.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginSenha.value});if(error)return msg(error.message,true);await boot()}
async function cadastrar(){const email=cadEmail.value.trim();let {error}=await db.auth.signUp({email,password:cadSenha.value,options:{emailRedirectTo:CONFIG.AUTH_REDIRECT_URL,data:{nome_completo:cadNome.value.trim()}}});if(error)return msg(error.message,true);loginEmail.value=email;authTab('login');msg('Conta criada. Enviamos um e-mail de confirmação. Após confirmar, você será direcionado ao Frete Carona. Se não receber, use o botão Reenviar e-mail de confirmação.')}
async function reenviarConfirmacao(){const email=loginEmail.value.trim();if(!email)return msg('Informe o e-mail da conta para reenviar a confirmação.',true);msg('Solicitando novo e-mail de confirmação…');const {error}=await db.auth.resend({type:'signup',email,options:{emailRedirectTo:CONFIG.AUTH_REDIRECT_URL}});if(error){const m=String(error.message||'');if(/rate|limit|security purposes|seconds/i.test(m))return msg('O Supabase limitou novos envios temporariamente. Aguarde alguns minutos e tente novamente. '+m,true);return msg('Não foi possível reenviar: '+m,true)}msg('Novo e-mail de confirmação solicitado. Verifique a caixa de entrada, Spam e Promoções.')}
async function logout(){await db.auth.signOut();location.reload()}
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session){auth.classList.remove('hide');main.classList.add('hide');return}user=session.user;auth.classList.add('hide');main.classList.remove('hide');let {data}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=data;go('home')}
function active(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p))}function go(p){pararRastreamento();active(p);({home,envios,viagens,oportunidades,operacoes,perfil}[p]||home)()}
async function home(){const nome=(profile?.nome_completo||user.email).split(' ')[0];const [{count:enviosN},{count:viagensN},{data:rep}]=await Promise.all([db.from('encomendas').select('*',{count:'exact',head:true}).eq('owner_id',user.id),db.from('viagens').select('*',{count:'exact',head:true}).eq('user_id',user.id),db.from('repasses').select('valor,status').eq('viajante_id',user.id)]);const ganhos=(rep||[]).filter(x=>x.status==='PAGO').reduce((a,x)=>a+Number(x.valor||0),0);content.innerHTML=`<div class='hero'><h1>Olá, ${esc(nome)} 👋</h1><p>O que você quer fazer hoje?</p></div><div class='grid'><button class='action' onclick='formEnvio()'><div class='ico'>📦</div><h3>Quero enviar</h3><p>Encontre alguém que já está indo para o seu destino.</p></button><button class='action' onclick='formViagem()'><div class='ico'>🚗</div><h3>Vou viajar</h3><p>Aproveite sua rota e ganhe levando uma encomenda.</p></button></div><div class='kpis'><div class='kpi'><b>${enviosN||0}</b><span class='tag'>Envios</span></div><div class='kpi'><b>${viagensN||0}</b><span class='tag'>Viagens</span></div><div class='kpi'><b>${brl(ganhos)}</b><span class='tag'>Ganhos</span></div></div><div class='section'><h2>Como funciona</h2><div class='card'>1. Cadastre sua viagem ou encomenda.<br>2. O Frete Carona procura compatibilidades.<br>3. As duas partes aceitam.<br>4. Coleta e entrega ficam registradas na plataforma.</div></div>${profile?.is_admin?`<div class='section'><h2>Administração</h2><div class='card'><b>Administrador Frete Carona</b><p class='muted' style='margin-top:6px'>Seu perfil possui acesso administrativo. O painel operacional completo será conectado na próxima evolução.</p></div></div>`:''}`}
function formEnvio(){content.innerHTML=`<div class='titlebar'><button class='back' onclick="go('home')">‹</button><h2>Nova encomenda</h2></div><div class='field'><label>O que você está enviando?</label><input id='eDesc' placeholder='Ex.: peças automotivas'></div><div class='row'><div class='field'><label>Volumes</label><input id='eVol' type='number' value='1' min='1'></div><div class='field'><label>Peso total (kg)</label><input id='ePeso' type='number' step='.01'></div></div><div class='field'><label>Valor declarado da mercadoria</label><input id='eValorMercadoria' type='number' step='.01' min='0' placeholder='R$'></div><div class='docbox'><b>Documento da encomenda</b><p class='muted' style='margin-top:5px'>Informe a documentação que acompanha o produto.</p><div class='docchoice'><button id='docDanfe' class='on' onclick="setTipoDocumento('DANFE')">Nota Fiscal / DANFE</button><button id='docDeclaracao' onclick="setTipoDocumento('DECLARACAO')">Declaração de conteúdo</button></div><div id='danfeBox'><div class='field'><label>Anexar DANFE</label><input id='eDanfe' type='file' accept='.pdf,image/jpeg,image/png,image/webp,application/pdf'></div><div class='small muted'>PDF, JPG, PNG ou WEBP • até 10 MB.</div></div><div id='declaracaoBox' class='hide'><div class='field'><label>Nome do remetente</label><input id='dRemetente' placeholder='Nome completo / razão social'></div><div class='field'><label>Nome do destinatário</label><input id='dDestinatario' placeholder='Nome completo / razão social'></div><div class='field'><label>Descrição detalhada do conteúdo</label><textarea id='dConteudo' rows='3' placeholder='Descreva os itens transportados'></textarea></div><div class='row'><div class='field'><label>Quantidade</label><input id='dQuantidade' type='number' min='1' value='1'></div><div class='field'><label>Valor declarado</label><input id='dValor' type='number' min='0' step='.01' placeholder='R$'></div></div><label class='checkline'><input id='dAceite' type='checkbox'> Declaro que as informações são verdadeiras e que o conteúdo não contém itens proibidos.</label></div></div><div class='field'><label>Endereço de coleta</label><input id='eColeta' placeholder='Digite e selecione o endereço'></div><div class='field'><label>Endereço de entrega</label><input id='eEntrega' placeholder='Digite e selecione o endereço'></div><div id='envioMap' class='map'></div><div class='mapnote'>Selecione os endereços sugeridos pelo Google para gravarmos as coordenadas e calcularmos o match.</div><div class='field'><label>Entregar até</label><input id='ePrazo' type='datetime-local'></div><div class='field'><label>Quanto deseja pagar pelo transporte?</label><input id='eValor' type='number' step='.01' placeholder='R$'></div><button class='btn primary full' onclick='salvarEnvio()'>Publicar encomenda</button><div id='formMsg'></div>`;window.tipoDocumentoAtual='DANFE';setTimeout(()=>setupAddressPair('eColeta','eEntrega','envioMap','envio'),50)}
function setTipoDocumento(t){window.tipoDocumentoAtual=t;docDanfe.classList.toggle('on',t==='DANFE');docDeclaracao.classList.toggle('on',t==='DECLARACAO');danfeBox.classList.toggle('hide',t!=='DANFE');declaracaoBox.classList.toggle('hide',t!=='DECLARACAO')}
async function uploadDocumentoEncomenda(encomendaId){if(tipoDocumentoAtual==='DANFE'){const f=eDanfe.files?.[0];if(!f)throw new Error('Anexe o DANFE/Nota Fiscal antes de publicar.');if(f.size>10*1024*1024)throw new Error('O documento deve ter no máximo 10 MB.');const ext=(f.name.split('.').pop()||'pdf').toLowerCase();const path=`${encomendaId}/danfe/${crypto.randomUUID()}.${ext}`;const {error}=await db.storage.from('documentos').upload(path,f,{upsert:false,contentType:f.type||undefined});if(error)throw error;const {error:e2}=await db.from('encomenda_documentos').insert({encomenda_id:encomendaId,usuario_id:user.id,tipo:'DANFE',arquivo_path:path,arquivo_nome:f.name,arquivo_tipo:f.type||null,arquivo_tamanho:f.size});if(e2)throw e2}else{if(!dRemetente.value.trim()||!dDestinatario.value.trim()||!dConteudo.value.trim()||!dAceite.checked)throw new Error('Preencha a declaração de conteúdo e confirme a responsabilidade pelas informações.');const {error}=await db.from('encomenda_documentos').insert({encomenda_id:encomendaId,usuario_id:user.id,tipo:'DECLARACAO_CONTEUDO',remetente_nome:dRemetente.value.trim(),destinatario_nome:dDestinatario.value.trim(),descricao_conteudo:dConteudo.value.trim(),quantidade:+dQuantidade.value||1,valor_declarado:+dValor.value||+eValorMercadoria.value||0,declaracao_responsabilidade:true});if(error)throw error}}
async function salvarEnvio(){const a=addressState.envio||{};const obj={owner_id:user.id,descricao:eDesc.value.trim(),quantidade_volumes:+eVol.value||1,peso_total_kg:ePeso.value?+ePeso.value:null,valor_declarado:eValorMercadoria.value?+eValorMercadoria.value:null,coleta_endereco:eColeta.value.trim(),coleta_cidade:a.origin?.city||null,coleta_uf:a.origin?.uf||null,coleta_latitude:a.origin?.lat||null,coleta_longitude:a.origin?.lng||null,entrega_endereco:eEntrega.value.trim(),entrega_cidade:a.destination?.city||null,entrega_uf:a.destination?.uf||null,entrega_latitude:a.destination?.lat||null,entrega_longitude:a.destination?.lng||null,entregar_ate:ePrazo.value?new Date(ePrazo.value).toISOString():null,valor_ofertado:+eValor.value||0,status:'RASCUNHO'};if(!obj.descricao||!obj.coleta_endereco||!obj.entrega_endereco||obj.valor_ofertado<=0)return formMsg.innerHTML="<div class='status error'>Preencha descrição, coleta, entrega e valor do transporte.</div>";if(!a.origin||!a.destination)return formMsg.innerHTML="<div class='status error'>Selecione coleta e entrega nas sugestões do Google Maps.</div>";if(tipoDocumentoAtual==='DANFE'&&!eDanfe.files?.[0])return formMsg.innerHTML="<div class='status error'>Anexe o DANFE/Nota Fiscal.</div>";if(tipoDocumentoAtual==='DECLARACAO'&&(!dRemetente.value.trim()||!dDestinatario.value.trim()||!dConteudo.value.trim()||!dAceite.checked))return formMsg.innerHTML="<div class='status error'>Preencha e aceite a declaração de conteúdo.</div>";formMsg.innerHTML="<div class='status'>Salvando encomenda e documento…</div>";let {data,error}=await db.from('encomendas').insert(obj).select('id').single();if(error)return formMsg.innerHTML=`<div class='status error'>${esc(error.message)}</div>`;try{await uploadDocumentoEncomenda(data.id)}catch(err){await db.from('encomendas').delete().eq('id',data.id);return formMsg.innerHTML=`<div class='status error'>Documento não salvo: ${esc(err.message)}</div>`}let r=await db.rpc('publicar_encomenda',{p_encomenda_id:data.id});if(r.error)return formMsg.innerHTML=`<div class='status error'>Encomenda salva, mas não foi publicada: ${esc(r.error.message)}</div>`;formMsg.innerHTML=`<div class='status'>Encomenda e documentação salvas. Matches encontrados: ${r.data??0}.</div>`;setTimeout(()=>go('envios'),1100)}
async function envios(){content.innerHTML='<h2>Meus envios</h2><div class="empty">Carregando…</div>';let {data,error}=await db.from('encomendas').select('*').eq('owner_id',user.id).order('created_at',{ascending:false});if(error)return content.innerHTML=`<h2>Meus envios</h2><div class='status error'>${esc(error.message)}</div>`;content.innerHTML='<h2>Meus envios</h2>'+(data?.length?data.map(x=>`<div class='card'><span class='pill'>${esc(x.status)}</span><h3>${esc(x.descricao)}</h3><div class='muted'>${esc(x.coleta_cidade||x.coleta_endereco)} → ${esc(x.entrega_cidade||x.entrega_endereco)}</div><p class='money'>${brl(x.valor_ofertado)}</p><div class='small'>${x.codigo?esc(x.codigo):''}</div></div>`).join(''):`<div class='empty'>Você ainda não publicou encomendas.<br><br><button class='btn primary' onclick='formEnvio()'>Criar envio</button></div>`)}

let trackingWatch=null,trackingTimer=null,currentOperation=null;
async function abrirOperacao(id){if(trackingWatch!==null){navigator.geolocation.clearWatch(trackingWatch);trackingWatch=null}currentOperation=id;const {data:c,error}=await db.from('contratacoes').select('*').eq('id',id).single();if(error)return alert(error.message);const [{data:e},{data:v},{data:co},{data:en}]=await Promise.all([db.from('encomendas').select('*').eq('id',c.encomenda_id).single(),db.from('viagens').select('*').eq('id',c.viagem_id).single(),db.from('coletas').select('*').eq('contratacao_id',id).maybeSingle(),db.from('entregas').select('*').eq('contratacao_id',id).maybeSingle()]);const viajante=c.viajante_id===user.id;content.innerHTML=`<div class='titlebar'><button class='back' onclick="go('oportunidades')">‹</button><h2>${viajante?'Minha entrega':'Acompanhar entrega'}</h2></div><span class='pill'>${esc(c.status)}</span><h3>${esc(e?.coleta_cidade||e?.coleta_endereco||'Coleta')} → ${esc(e?.entrega_cidade||e?.entrega_endereco||'Entrega')}</h3><div id='liveMap' class='map'></div><div id='liveInfo' class='live'>Carregando localização…</div><div class='card'><div class='step'><span class='dot'></span><div><b>Coleta</b><div class='muted'>${esc(e?.coleta_endereco||'')}</div></div></div><div class='step'><span class='dot'></span><div><b>Entrega</b><div class='muted'>${esc(e?.entrega_endereco||'')}</div></div></div><div class='ops'><button class='btn secondary' onclick="abrirNavegacao('${viajante && co?.status!=='COLETADA'?'coleta':'entrega'}')">Abrir no Google Maps</button>${viajante?`<button class='btn primary' onclick="iniciarRastreamento('${id}','${c.viagem_id}')">Compartilhar localização</button><button class='btn dangerbtn' onclick='pararRastreamento()'>Parar</button>`:''}</div></div>${viajante?`<div class='card'><h3>Evidência de coleta</h3><div class='field'><label>Foto da coleta</label><input id='fotoColeta' type='file' accept='image/*' capture='environment'></div><div class='field'><label>Volumes coletados</label><input id='volColeta' type='number' min function gps(){return new Promise((resolve,reject)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy}),reject,{enableHighAccuracy:true,timeout:15000,maximumAge:5000}):reject(new Error('GPS não disponível.')))}

function abrirNavegacao(tipo){const e=liveShipment;if(!e)return;const lat=tipo==='coleta'?e.coleta_latitude:e.entrega_latitude,lng=tipo==='coleta'?e.coleta_longitude:e.entrega_longitude;if(lat==null||lng==null)return alert('Destino sem coordenadas.');window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(lat+','+lng)}&travelmode=driving`,'_blank')}

async function perfil(){let {data}=await db.from('profiles').select('*').eq('id',user.id).single();profile=data||profile;let hab=null;try{const r=await db.from('habilitacoes_viajante').select('*').eq('user_id',user.id).maybeSingle();hab=r.data}catch(e){}const st=hab?.status||'NAO_INICIADO', cls=st==='APROVADO'?'ok':st==='REPROVADO'?'blocked':'pending';content.innerHTML=`<h2>Meu perfil</h2><div class='card'><div style='display:flex;gap:12px;align-items:center'><div class='shield'>🛡️</div><div><h3 style='margin:0'>${esc(profile?.nome_completo||'Usuário')}</h3><div class='muted'>${esc(user.email)}</div><div class='${cls}' style='margin-top:5px'>${st==='APROVADO'?'Viajante verificado':st==='EM_ANALISE'?'Verificação em análise':st==='REPROVADO'?'Verificação requer correção':'Verificação pendente'}</div></div></div><p>⭐ ${esc(profile?.nota_media||0)} • ${esc(profile?.total_avaliacoes||0)} avaliações</p>${profile?.is_admin?`<span class='pill'>ADMIN</span>`:''}</div><div class='card'><h3>Segurança e habilitação</h3><div class='verify'><span>📱 Celular</span><b class='${hab?.telefone_verificado?'ok':'pending'}'>${hab?.telefone_verificado?'Verificado':'Pendente'}</b></div><div class='verify'><span>🪪 Identidade / CPF</span><b class='${hab?.identidade_verificada?'ok':'pending'}'>${hab?.identidade_verificada?'Verificado':'Pendente'}</b></div><div class='verify'><span>🚘 CNH</span><b class='${hab?.cnh_verificada?'ok':'pending'}'>${hab?.cnh_verificada?'Verificada':'Pendente'}</b></div><div class='verify'><span>🚗 Veículo / CRLV</span><b class='${hab?.veiculo_verificado?'ok':'pending'}'>${hab?.veiculo_verificado?'Verificado':'Pendente'}</b></div><div class='verify'><span>🏢 MEI / CNPJ</span><b class='${hab?.cnpj_verificado?'ok':'pending'}'>${hab?.cnpj_verificado?'Verificado':hab?.cnpj?'Em análise':'Quando aplicável'}</b></div><div class='verify'><span>🚚 RNTRC / ANTT</span><b class='${hab?.rntrc_verificado?'ok':'pending'}'>${hab?.rntrc_verificado?'Verificado':hab?.rntrc?'Em análise':'Quando aplicável'}</b></div><div class='notice'><b>Importante</b><div class='small' style='margin-top:5px'>Os requisitos variam conforme veículo e operação. O cadastro na plataforma não substitui licenças, registros ou autorizações legalmente exigíveis.</div></div><button class='btn primary full' onclick='formHabilitacao()'>${hab?'Atualizar meus dados':'Iniciar verificação'}</button></div><div class='card'><div class='field'><label>Nome completo</label><input id='pNome' value='${esc(profile?.nome_completo||'')}'></div><button class='btn secondary full' onclick='salvarPerfil()'>Salvar nome</button><div id='perfilMsg'></div></div>`}
function formHabilitacao(){content.innerHTML=`<div class='titlebar'><button class='back' onclick="go('perfil')">‹</button><h2>Verificação do viajante</h2></div><div class='notice'>Seus documentos ficam em área privada e são usados para análise de identidade, veículo e requisitos da operação.</div><div class='card'><h3>1. Identidade</h3><div class='field'><label>CPF</label><input id='hCpf' inputmode='numeric' placeholder='000.000.000-00'></div><div class='field'><label>Celular</label><input id='hCelular' inputmode='tel' placeholder='(11) 99999-9999'></div><div class='field'><label>Documento com foto (CNH)</label><input id='hCnhFoto' type='file' accept='image/*,application/pdf'></div><div class='field'><label>Selfie para validação</label><input id='hSelfie' type='file' accept='image/*' capture='user'></div></div><div class='card'><h3>2. Veículo</h3><div class='row'><div class='field'><label>Placa</label><input id='hPlaca' placeholder='ABC1D23'></div><div class='field'><label>Tipo</label><select id='hTipoVeiculo'><option>CARRO</option><option>MOTO</option><option>UTILITARIO</option><option>VAN</option><option>VUC</option><option>CAMINHAO</option></select></div></div><div class='field'><label>CRLV</label><input id='hCrlv' type='file' accept='image/*,application/pdf'></div></div><div class='card'><h3>3. Dados profissionais</h3><div class='field'><label>CNPJ / MEI (quando aplicável)</label><input id='hCnpj' inputmode='numeric'></div><div class='field'><label>RNTRC / ANTT (quando aplicável)</label><input id='hRntrc'></div><label class='checkline'><input id='hTermos' type='checkbox'> Declaro que os dados são verdadeiros e autorizo a validação dos documentos para fins de segurança e habilitação na plataforma.</label></div><button class='btn primary full' onclick='salvarHabilitacao()'>Enviar para análise</button><div id='habMsg'></div>`}
async function uploadHab(file,tipo){if(!file)return null;if(file.size>10*1024*1024)throw new Error('Cada documento deve ter no máximo 10 MB.');const ext=(file.name.split('.').pop()||'bin').toLowerCase();const path=`${user.id}/${tipo}/${crypto.randomUUID()}.${ext}`;const r=await db.storage.from('documentos-usuarios').upload(path,file,{upsert:false,contentType:file.type||undefined});if(r.error)throw r.error;return path}
async function salvarHabilitacao(){if(!hCpf.value.trim()||!hCelular.value.trim()||!hPlaca.value.trim()||!hCnhFoto.files?.[0]||!hSelfie.files?.[0]||!hCrlv.files?.[0]||!hTermos.checked)return habMsg.innerHTML="<div class='status error'>Preencha CPF, celular, placa e envie CNH, selfie e CRLV.</div>";habMsg.innerHTML="<div class='status'>Enviando documentos com segurança…</div>";try{const [cnh,selfie,crlv]=await Promise.all([uploadHab(hCnhFoto.files[0],'cnh'),uploadHab(hSelfie.files[0],'selfie'),uploadHab(hCrlv.files[0],'crlv')]);const row={user_id:user.id,cpf:hCpf.value.trim(),celular:hCelular.value.trim(),placa:hPlaca.value.trim().toUpperCase(),tipo_veiculo:hTipoVeiculo.value,cnpj:hCnpj.value.trim()||null,rntrc:hRntrc.value.trim()||null,cnh_path:cnh,selfie_path:selfie,crlv_path:crlv,status:'EM_ANALISE',consentimento_validacao:true,consentido_em:new Date().toISOString()};const r=await db.from('habilitacoes_viajante').upsert(row,{onConflict:'user_id'});if(r.error)throw r.error;habMsg.innerHTML="<div class='status'>Documentos enviados. Sua verificação está em análise.</div>";setTimeout(()=>go('perfil'),1000)}catch(e){habMsg.innerHTML=`<div class='status error'>${esc(e.message)}</div>`}}
async function salvarPerfil(){const nome=pNome.value.trim();if(!nome)return perfilMsg.innerHTML="<div class='status error'>Informe seu nome.</div>";let {error}=await db.from('profiles').update({nome_completo:nome}).eq('id',user.id);if(error)return perfilMsg.innerHTML=`<div class='status error'>${esc(error.message)}</div>`;profile.nome_completo=nome;perfilMsg.innerHTML="<div class='status'>Perfil atualizado.</div>"}

const addressState={};let googleMapsPromise=null;
function loadGoogleMaps(){if(window.google?.maps?.places)return Promise.resolve();if(CONFIG.GOOGLE_MAPS_KEY==='COLE_SUA_CHAVE_GOOGLE_MAPS_AQUI')return Promise.reject(new Error('Configure GOOGLE_MAPS_KEY no início do index.html.'));if(googleMapsPromise)return googleMapsPromise;googleMapsPromise=new Promise((resolve,reject)=>{window.__fcGoogleReady=resolve;const sc=document.createElement('script');sc.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(CONFIG.GOOGLE_MAPS_KEY)+'&libraries=places&callback=__fcGoogleReady';sc.async=true;sc.defer=true;sc.onerror=()=>reject(new Error('Não foi possível carregar o Google Maps.'));document.head.appendChild(sc)});return googleMapsPromise}
function placeData(place){const comp=place.address_components||[];const get=t=>comp.find(c=>c.types.includes(t));return{address:place.formatted_address||place.name||'',lat:place.geometry.location.lat(),lng:place.geometry.location.lng(),city:(get('administrative_area_level_2')||get('locality')||get('sublocality'))?.long_name||'',uf:get('administrative_area_level_1')?.short_name||''}}
async function setupAddressPair(originId,destinationId,mapId,key){
 const mapEl=document.getElementById(mapId);try{await loadGoogleMaps()}catch(e){if(mapEl)mapEl.innerHTML=`<div class='status error' style='margin:12px'>${esc(e.message)}</div>`;return}
 addressState[key]={}; const o=document.getElementById(originId),d=document.getElementById(destinationId);
 const map=new google.maps.Map(mapEl,{center:{lat:-23.55,lng:-46.63},zoom:8,mapTypeControl:false,streetViewControl:false,fullscreenControl:false});
 const renderer=new google.maps.DirectionsRenderer({map,preserveViewport:false}); const service=new google.maps.DirectionsService();
 let mo=null,md=null;
 function route(){const a=addressState[key];if(!a.origin||!a.destination)return;service.route({origin:{lat:a.origin.lat,lng:a.origin.lng},destination:{lat:a.destination.lat,lng:a.destination.lng},travelMode:google.maps.TravelMode.DRIVING},(res,status)=>{if(status==='OK'){renderer.setDirections(res);const leg=res.routes?.[0]?.legs?.[0];if(leg){a.distanceMeters=leg.distance?.value||null;a.durationSeconds=leg.duration?.value||null}}})}
 function bind(input,side){
   const ac=new google.maps.places.Autocomplete(input,{componentRestrictions:{country:'br'},fields:['formatted_address','geometry','address_components','name'],types:['geocode']});
   ac.addListener('place_changed',()=>{
     const p=ac.getPlace(); if(!p?.geometry?.location){addressState[key][side]=null;return}
     const data=placeData(p); data.address=p.formatted_address||data.address||input.value.trim(); addressState[key][side]=data;
     input.value=data.address; input.dataset.selected='1'; input.dataset.lat=String(data.lat); input.dataset.lng=String(data.lng);
     input.blur();
     const pos={lat:data.lat,lng:data.lng};
     if(side==='origin'){if(mo)mo.setMap(null);mo=new google.maps.Marker({map,position:pos,label:'A',title:'Origem / coleta'})}
     else {if(md)md.setMap(null);md=new google.maps.Marker({map,position:pos,label:'B',title:'Destino / entrega'})}
     map.panTo(pos); map.setZoom(15); route();
   });
   input.addEventListener('input',()=>{if(input.dataset.selected==='1'){delete input.dataset.selected;addressState[key][side]=null}});
   input.addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault()});
   return ac;
 }
 bind(o,'origin'); bind(d,'destination');
}

db.auth.onAuthStateChange(()=>{});boot();
