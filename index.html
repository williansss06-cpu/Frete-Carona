<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Frete Carona</title>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#17202a;--muted:#687384;--brand:#16a36a;--brand2:#0d7e52;--line:#e6e9ef;--warn:#fff6dd;--danger:#c83b3b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:620px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 40px #0000000c}.top{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;font-size:21px}.logo b{color:var(--brand)}.page{padding:18px 18px 92px}.hero{background:linear-gradient(135deg,#075f43,#19b877);color:#fff;padding:22px;border-radius:22px;margin-bottom:18px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;opacity:.92}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:18px;text-align:left;cursor:pointer;min-height:142px}.action .ico{font-size:31px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.kpi b{display:block;font-size:18px;color:var(--brand2)}.tag{font-size:11px;color:var(--muted)}.action h3{margin:12px 0 5px}.action p,.muted{color:var(--muted);font-size:13px;margin:0}.section{margin-top:22px}.section h2{font-size:17px;margin:0 0 12px}.card{border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:10px;background:#fff}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#eef8f3;color:var(--brand2)}.full{width:100%}.field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9dee7;border-radius:11px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:transparent;font-size:10px;color:#687384;padding:4px}.nav span{display:block;font-size:20px}.nav .active{color:var(--brand);font-weight:800}.hide{display:none!important}.auth{padding:36px 22px}.auth .mark{font-size:40px}.auth h1{margin:8px 0}.tabs{display:flex;background:#f0f3f6;border-radius:12px;padding:4px;margin:20px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px}.tabs .on{background:#fff;font-weight:800;box-shadow:0 2px 8px #0001}.status{padding:10px 12px;border-radius:10px;font-size:13px;margin:10px 0;background:#eef8f3}.error{background:#fff0f0;color:var(--danger)}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef8f3;color:var(--brand2);font-size:11px;font-weight:800}.money{font-size:20px;font-weight:900;color:var(--brand2)}.empty{text-align:center;color:var(--muted);padding:25px 10px}.back{border:0;background:none;font-size:23px;cursor:pointer}.titlebar{display:flex;align-items:center;gap:8px;margin-bottom:18px}.titlebar h2{margin:0}.map{height:230px;border:1px solid var(--line);border-radius:16px;margin:12px 0;background:#eef3f0}.mapnote{font-size:12px;color:var(--muted);margin:-4px 0 12px}.small{font-size:12px}.logout{border:0;background:#f3f5f8;padding:8px 10px;border-radius:9px;cursor:pointer}
</style></head><body><div class='app'>
<div id='auth' class='auth'><div class='mark'>🚗📦</div><h1>Frete <span style='color:var(--brand)'>Carona</span></h1><p class='muted'>Tem espaço? Tem oportunidade.</p><div class='tabs'><button id='tabLogin' class='on' onclick="authTab('login')">Entrar</button><button id='tabCadastro' onclick="authTab('cadastro')">Criar conta</button></div>
<div id='loginBox'><div class='field'><label>E-mail</label><input id='loginEmail' type='email' placeholder='seu@email.com'></div><div class='field'><label>Senha</label><input id='loginSenha' type='password' placeholder='••••••••'></div><button class='btn primary full' onclick='login()'>Entrar</button></div>
<div id='cadBox' class='hide'><div class='field'><label>Nome completo</label><input id='cadNome'></div><div class='field'><label>E-mail</label><input id='cadEmail' type='email'></div><div class='field'><label>Senha</label><input id='cadSenha' type='password' minlength='6'></div><button class='btn primary full' onclick='cadastrar()'>Criar minha conta</button></div><div id='authMsg'></div></div>
<div id='main' class='hide'><header class='top'><div class='logo'>Frete <b>Carona</b></div><button class='logout' onclick='logout()'>Sair</button></header><main id='content' class='page'></main><nav class='nav'><button data-page='home' onclick="go('home')"><span>⌂</span>Início</button><button data-page='envios' onclick="go('envios')"><span>📦</span>Envios</button><button data-page='viagens' onclick="go('viagens')"><span>🚗</span>Viagens</button><button data-page='oportunidades' onclick="go('oportunidades')"><span>⚡</span>Ofertas</button><button data-page='perfil' onclick="go('perfil')"><span>👤</span>Perfil</button></nav></div></div>
<script>
const CONFIG={
  SUPABASE_URL:'https://rlugagtmbuseydsuyskc.supabase.co',
  SUPABASE_PUBLISHABLE_KEY:'sb_publishable_5S522tMYto-HQI1N9T6iSg_qoxN15S9',
  GOOGLE_MAPS_KEY:'AIzaSyAo-qusN6jZTGpo1w1BlFqsSrqmVHCLjuU'
};
const SUPABASE_URL=CONFIG.SUPABASE_URL;
const SUPABASE_PUBLISHABLE_KEY=CONFIG.SUPABASE_PUBLISHABLE_KEY;
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let user=null,profile=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function msg(t,e=false){document.getElementById('authMsg').innerHTML=`<div class='status ${e?'error':''}'>${esc(t)}</div>`}
function authTab(t){document.getElementById('loginBox').classList.toggle('hide',t!=='login');document.getElementById('cadBox').classList.toggle('hide',t!=='cadastro');document.getElementById('tabLogin').classList.toggle('on',t==='login');document.getElementById('tabCadastro').classList.toggle('on',t==='cadastro')}
async function login(){let {error}=await db.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginSenha.value});if(error)return msg(error.message,true);await boot()}
async function cadastrar(){let {error}=await db.auth.signUp({email:cadEmail.value.trim(),password:cadSenha.value,options:{data:{nome_completo:cadNome.value.trim()}}});if(error)return msg(error.message,true);msg('Conta criada. Se a confirmação de e-mail estiver ativa, confirme seu e-mail e depois entre.')}
async function logout(){await db.auth.signOut();location.reload()}
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session){auth.classList.remove('hide');main.classList.add('hide');return}user=session.user;auth.classList.add('hide');main.classList.remove('hide');let {data}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=data;go('home')}
function active(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p))}function go(p){active(p);({home,envios,viagens,oportunidades,perfil}[p]||home)()}
async function home(){const nome=(profile?.nome_completo||user.email).split(' ')[0];const [{count:enviosN},{count:viagensN},{data:rep}]=await Promise.all([db.from('encomendas').select('*',{count:'exact',head:true}).eq('owner_id',user.id),db.from('viagens').select('*',{count:'exact',head:true}).eq('user_id',user.id),db.from('repasses').select('valor,status').eq('viajante_id',user.id)]);const ganhos=(rep||[]).filter(x=>x.status==='PAGO').reduce((a,x)=>a+Number(x.valor||0),0);content.innerHTML=`<div class='hero'><h1>Olá, ${esc(nome)} 👋</h1><p>O que você quer fazer hoje?</p></div><div class='grid'><button class='action' onclick='formEnvio()'><div class='ico'>📦</div><h3>Quero enviar</h3><p>Encontre alguém que já está indo para o seu destino.</p></button><button class='action' onclick='formViagem()'><div class='ico'>🚗</div><h3>Vou viajar</h3><p>Aproveite sua rota e ganhe levando uma encomenda.</p></button></div><div class='kpis'><div class='kpi'><b>${enviosN||0}</b><span class='tag'>Envios</span></div><div class='kpi'><b>${viagensN||0}</b><span class='tag'>Viagens</span></div><div class='kpi'><b>${brl(ganhos)}</b><span class='tag'>Ganhos</span></div></div><div class='section'><h2>Como funciona</h2><div class='card'>1. Cadastre sua viagem ou encomenda.<br>2. O Frete Carona procura compatibilidades.<br>3. As duas partes aceitam.<br>4. Coleta e entrega ficam registradas na plataforma.</div></div>${profile?.is_admin?`<div class='section'><h2>Administração</h2><div class='card'><b>Administrador Frete Carona</b><p class='muted' style='margin-top:6px'>Seu perfil possui acesso administrativo. O painel operacional completo será conectado na próxima evolução.</p></div></div>`:''}`}
function formEnvio(){content.innerHTML=`<div class='titlebar'><button class='back' onclick="go('home')">‹</button><h2>Nova encomenda</h2></div><div class='field'><label>O que você está enviando?</label><input id='eDesc' placeholder='Ex.: peças automotivas'></div><div class='row'><div class='field'><label>Volumes</label><input id='eVol' type='number' value='1' min='1'></div><div class='field'><label>Peso total (kg)</label><input id='ePeso' type='number' step='.01'></div></div><div class='field'><label>Endereço de coleta</label><input id='eColeta' placeholder='Digite e selecione o endereço'></div><div class='field'><label>Endereço de entrega</label><input id='eEntrega' placeholder='Digite e selecione o endereço'></div><div id='envioMap' class='map'></div><div class='mapnote'>Selecione os endereços sugeridos pelo Google para gravarmos as coordenadas e calcularmos o match.</div><div class='field'><label>Entregar até</label><input id='ePrazo' type='datetime-local'></div><div class='field'><label>Quanto deseja pagar?</label><input id='eValor' type='number' step='.01' placeholder='R$'></div><button class='btn primary full' onclick='salvarEnvio()'>Publicar encomenda</button><div id='formMsg'></div>`;setTimeout(()=>setupAddressPair('eColeta','eEntrega','envioMap','envio'),50)}
async function salvarEnvio(){const a=addressState.envio||{};const obj={owner_id:user.id,descricao:eDesc.value.trim(),quantidade_volumes:+eVol.value||1,peso_total_kg:ePeso.value?+ePeso.value:null,coleta_endereco:eColeta.value.trim(),coleta_cidade:a.origin?.city||null,coleta_uf:a.origin?.uf||null,coleta_latitude:a.origin?.lat||null,coleta_longitude:a.origin?.lng||null,entrega_endereco:eEntrega.value.trim(),entrega_cidade:a.destination?.city||null,entrega_uf:a.destination?.uf||null,entrega_latitude:a.destination?.lat||null,entrega_longitude:a.destination?.lng||null,entregar_ate:ePrazo.value?new Date(ePrazo.value).toISOString():null,valor_ofertado:+eValor.value||0,status:'RASCUNHO'};if(!obj.descricao||!obj.coleta_endereco||!obj.entrega_endereco||obj.valor_ofertado<=0)return formMsg.innerHTML="<div class='status error'>Preencha descrição, coleta, entrega e valor.</div>";if(!a.origin||!a.destination)return formMsg.innerHTML="<div class='status error'>Selecione coleta e entrega nas sugestões do Google Maps.</div>";let {data,error}=await db.from('encomendas').insert(obj).select('id').single();if(error)return formMsg.innerHTML=`<div class='status error'>${esc(error.message)}</div>`;let r=await db.rpc('publicar_encomenda',{p_encomenda_id:data.id});formMsg.innerHTML=`<div class='status'>Encomenda publicada. Matches encontrados: ${r.data??0}.</div>`;setTimeout(()=>go('envios'),900)}
async function envios(){content.innerHTML='<h2>Meus envios</h2><div class="empty">Carregando…</div>';let {data,error}=await db.from('encomendas').select('*').eq('owner_id',user.id).order('created_at',{ascending:false});if(error)return content.innerHTML=`<h2>Meus envios</h2><div class='status error'>${esc(error.message)}</div>`;content.innerHTML='<h2>Meus envios</h2>'+(data?.length?data.map(x=>`<div class='card'><span class='pill'>${esc(x.status)}</span><h3>${esc(x.descricao)}</h3><div class='muted'>${esc(x.coleta_cidade||x.coleta_endereco)} → ${esc(x.entrega_cidade||x.entrega_endereco)}</div><p class='money'>${brl(x.valor_ofertado)}</p><div class='small'>${x.codigo?esc(x.codigo):''}</div></div>`).join(''):`<div class='empty'>Você ainda não publicou encomendas.<br><br><button class='btn primary' onclick='formEnvio()'>Criar envio</button></div>`)}
function formViagem(){content.innerHTML=`<div class='titlebar'><button class='back' onclick="go('home')">‹</button><h2>Cadastrar viagem</h2></div><div class='field'><label>De onde você vai sair?</label><input id='vOrigem' placeholder='Digite e selecione a origem'></div><div class='field'><label>Para onde você vai?</label><input id='vDestino' placeholder='Digite e selecione o destino'></div><div id='viagemMap' class='map'></div><div class='mapnote'>A rota exibida é uma prévia visual. O motor do Frete Carona usa as coordenadas gravadas para procurar oportunidades.</div><div class='row'><div class='field'><label>Data</label><input id='vData' type='date'></div><div class='field'><label>Saída</label><input id='vHora' type='time'></div></div><div class='row'><div class='field'><label>Capacidade disponível (kg)</label><input id='vKg' type='number' step='.01'></div><div class='field'><label>Desvio máximo (km)</label><input id='vDesvio' type='number' value='10'></div></div><button class='btn primary full' onclick='salvarViagem()'>Cadastrar viagem</button><div id='formMsg'></div>`;setTimeout(()=>setupAddressPair('vOrigem','vDestino','viagemMap','viagem'),50)}
async function salvarViagem(){const a=addressState.viagem||{};const obj={user_id:user.id,origem_endereco:vOrigem.value.trim(),origem_cidade:a.origin?.city||null,origem_uf:a.origin?.uf||null,origem_latitude:a.origin?.lat||null,origem_longitude:a.origin?.lng||null,destino_endereco:vDestino.value.trim(),destino_cidade:a.destination?.city||null,destino_uf:a.destination?.uf||null,destino_latitude:a.destination?.lat||null,destino_longitude:a.destination?.lng||null,data_viagem:vData.value,horario_saida:vHora.value||null,capacidade_disponivel_kg:vKg.value?+vKg.value:null,desvio_maximo_km:+vDesvio.value||10,status:'ATIVA'};if(!obj.origem_endereco||!obj.destino_endereco||!obj.data_viagem)return formMsg.innerHTML="<div class='status error'>Preencha origem, destino e data.</div>";if(!a.origin||!a.destination)return formMsg.innerHTML="<div class='status error'>Selecione origem e destino nas sugestões do Google Maps.</div>";let {error}=await db.from('viagens').insert(obj);if(error)return formMsg.innerHTML=`<div class='status error'>${esc(error.message)}</div>`;formMsg.innerHTML="<div class='status'>Viagem cadastrada com sucesso.</div>";setTimeout(()=>go('viagens'),800)}
async function viagens(){content.innerHTML='<h2>Minhas viagens</h2><div class="empty">Carregando…</div>';let {data,error}=await db.from('viagens').select('*').eq('user_id',user.id).order('data_viagem',{ascending:true});if(error)return content.innerHTML=`<h2>Minhas viagens</h2><div class='status error'>${esc(error.message)}</div>`;content.innerHTML='<h2>Minhas viagens</h2>'+(data?.length?data.map(x=>`<div class='card'><span class='pill'>${esc(x.status)}</span><h3>${esc(x.origem_cidade||x.origem_endereco)} → ${esc(x.destino_cidade||x.destino_endereco)}</h3><div class='muted'>📅 ${esc(x.data_viagem)} ${x.horario_saida?'• '+esc(x.horario_saida.slice(0,5)):''}</div><div class='small' style='margin-top:8px'>Desvio máximo: ${esc(x.desvio_maximo_km)} km ${x.capacidade_disponivel_kg?'• '+esc(x.capacidade_disponivel_kg)+' kg':''}</div></div>`).join(''):`<div class='empty'>Nenhuma viagem cadastrada.<br><br><button class='btn primary' onclick='formViagem()'>Cadastrar viagem</button></div>`)}
async function oportunidades(){content.innerHTML='<h2>Oportunidades</h2><div class="empty">Carregando…</div>';let {data,error}=await db.from('ofertas').select('*').eq('viajante_id',user.id).order('created_at',{ascending:false});if(error)return content.innerHTML=`<h2>Oportunidades</h2><div class='status error'>${esc(error.message)}</div>`;content.innerHTML='<h2>Oportunidades</h2>'+(data?.length?data.map(x=>`<div class='card'><span class='pill'>${esc(x.status)}</span><h3>Frete disponível</h3><div class='money'>Você recebe ${brl(x.valor_viajante)}</div><div class='muted'>Frete ${brl(x.valor_frete)} • Comissão ${esc(x.percentual_comissao)}%</div>${x.status==='PENDENTE'?`<button class='btn primary full' style='margin-top:12px' onclick="aceitarOferta('${x.id}')">Aceitar oportunidade</button>`:''}</div>`).join(''):`<div class='empty'>Nenhuma oferta no momento.<br>Quando uma encomenda combinar com sua viagem, ela aparecerá aqui.</div>`)}
async function aceitarOferta(id){let {error}=await db.rpc('viajante_aceitar_oferta',{p_oferta_id:id});if(error)alert(error.message);else oportunidades()}
async function perfil(){let {data}=await db.from('profiles').select('*').eq('id',user.id).single();profile=data||profile;content.innerHTML=`<h2>Meu perfil</h2><div class='card'><div style='font-size:42px'>👤</div><h3>${esc(profile?.nome_completo||'Usuário')}</h3><div class='muted'>${esc(user.email)}</div><p>⭐ ${esc(profile?.nota_media||0)} • ${esc(profile?.total_avaliacoes||0)} avaliações</p><span class='pill'>${esc(profile?.verificacao_identidade||'PENDENTE')}</span>${profile?.is_admin?` <span class='pill'>ADMIN</span>`:''}</div><div class='card'><div class='field'><label>Nome completo</label><input id='pNome' value='${esc(profile?.nome_completo||'')}'></div><button class='btn primary full' onclick='salvarPerfil()'>Salvar perfil</button><div id='perfilMsg'></div></div><div class='card'><b>Uma conta, dois lados.</b><p class='muted' style='margin-top:7px'>Você pode enviar encomendas e também cadastrar viagens para ganhar levando algo no caminho.</p></div>`}
async function salvarPerfil(){const nome=pNome.value.trim();if(!nome)return perfilMsg.innerHTML="<div class='status error'>Informe seu nome.</div>";let {error}=await db.from('profiles').update({nome_completo:nome}).eq('id',user.id);if(error)return perfilMsg.innerHTML=`<div class='status error'>${esc(error.message)}</div>`;profile.nome_completo=nome;perfilMsg.innerHTML="<div class='status'>Perfil atualizado.</div>"}

const addressState={};let googleMapsPromise=null;
function loadGoogleMaps(){if(window.google?.maps?.places)return Promise.resolve();if(CONFIG.GOOGLE_MAPS_KEY==='COLE_SUA_CHAVE_GOOGLE_MAPS_AQUI')return Promise.reject(new Error('Configure GOOGLE_MAPS_KEY no início do index.html.'));if(googleMapsPromise)return googleMapsPromise;googleMapsPromise=new Promise((resolve,reject)=>{window.__fcGoogleReady=resolve;const sc=document.createElement('script');sc.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(CONFIG.GOOGLE_MAPS_KEY)+'&libraries=places&callback=__fcGoogleReady';sc.async=true;sc.defer=true;sc.onerror=()=>reject(new Error('Não foi possível carregar o Google Maps.'));document.head.appendChild(sc)});return googleMapsPromise}
function placeData(place){const comp=place.address_components||[];const get=t=>comp.find(c=>c.types.includes(t));return{address:place.formatted_address||place.name||'',lat:place.geometry.location.lat(),lng:place.geometry.location.lng(),city:(get('administrative_area_level_2')||get('locality')||get('sublocality'))?.long_name||'',uf:get('administrative_area_level_1')?.short_name||''}}
async function setupAddressPair(originId,destinationId,mapId,key){const mapEl=document.getElementById(mapId);try{await loadGoogleMaps()}catch(e){if(mapEl)mapEl.innerHTML=`<div class='status error' style='margin:12px'>${esc(e.message)}</div>`;return}addressState[key]={};const o=document.getElementById(originId),d=document.getElementById(destinationId);const map=new google.maps.Map(mapEl,{center:{lat:-23.55,lng:-46.63},zoom:8,mapTypeControl:false,streetViewControl:false,fullscreenControl:false});const renderer=new google.maps.DirectionsRenderer({map,preserveViewport:false});const service=new google.maps.DirectionsService();const acO=new google.maps.places.Autocomplete(o,{componentRestrictions:{country:'br'},fields:['formatted_address','geometry','address_components','name']});const acD=new google.maps.places.Autocomplete(d,{componentRestrictions:{country:'br'},fields:['formatted_address','geometry','address_components','name']});function route(){const a=addressState[key];if(!a.origin||!a.destination)return;service.route({origin:{lat:a.origin.lat,lng:a.origin.lng},destination:{lat:a.destination.lat,lng:a.destination.lng},travelMode:google.maps.TravelMode.DRIVING},(res,status)=>{if(status==='OK')renderer.setDirections(res)})}acO.addListener('place_changed',()=>{const p=acO.getPlace();if(!p.geometry)return;addressState[key].origin=placeData(p);o.value=addressState[key].origin.address;route()});acD.addListener('place_changed',()=>{const p=acD.getPlace();if(!p.geometry)return;addressState[key].destination=placeData(p);d.value=addressState[key].destination.address;route()})}

db.auth.onAuthStateChange(()=>{});boot();
</script></body></html>
